{{define "templates/pan/oxygen/view-code.html"}}
{{template "templates/pan/oxygen/view-base.html" .}}
{{end}}
{{define "oxygen-content-code"}}
<style>
	.code {
		padding: 12px 16px;
		overflow-x: auto;
		border: 1px solid var(--vt-border);
		border-radius: 10px;
		-webkit-overflow-scrolling: touch;
		margin: 8px;
	}
</style>
<link rel="stylesheet" href="{{index $.config.CdnFiles "highlightjs@atom@dark@css"}}">
<link rel="stylesheet" href="{{index $.config.CdnFiles "highlightjs@atom@light@css"}}">
<pre class="code"><code id="editor" class="nohighlight"></code></pre>
{{end}}
{{define "oxygen-scripts-code"}}
<script src="{{index $.config.CdnFiles "highlight@js"}}"></script>
<script>
	(function () {
		var path = document.getElementById("view_down_link").getAttribute("data-path");
		var fullUrl = encodeURI(window.location.protocol + "//" + window.location.host + {{toJSON $.config.PathPrefix}} + "/api/v3/public/raw" + path);
		$.ajax({
			method: "GET",
			url: fullUrl,
			dataType: "html",
			success: function (data) {
				if ({{toJSON (index $.fns 0).FileType}} == "txt") {
					$("#editor").html(data);
				} else {
					if (typeof data == "object") {
						data = JSON.stringify(data, null, 4);
					} else {
						try {
							var jsonObj = JSON.parse(data);
							if (typeof jsonObj == "object") data = JSON.stringify(jsonObj, null, 4);
						} catch (e) {}
					}
					$("#editor").html(hljs.highlightAuto(data).value);
				}
			}
		});
	})();
</script>
{{end}}
