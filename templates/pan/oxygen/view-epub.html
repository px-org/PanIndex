{{define "templates/pan/oxygen/view-epub.html"}}
{{template "templates/pan/oxygen/view-base.html" .}}
{{end}}
{{define "oxygen-content-epub"}}
<div class="rounded-lg border border-[var(--vt-border)] p-4 m-2 relative">
	<select id="toc" class="block mx-auto mb-3 px-3 py-2 rounded-md border border-[var(--vt-border)] bg-[var(--vt-card)] text-[var(--vt-text)]"></select>
	<div id="viewer" class="vt-md"></div>
	<a id="prev" href="#prev" class="arrow absolute left-2 top-1/2 text-3xl opacity-60 hover:opacity-100">‹</a>
	<a id="next" href="#next" class="arrow absolute right-2 top-1/2 text-3xl opacity-60 hover:opacity-100">›</a>
</div>
{{end}}
{{define "oxygen-scripts-epub"}}
<script src="{{index $.config.CdnFiles "jszip@js"}}"></script>
<script src="{{index $.config.CdnFiles "epub@js"}}"></script>
<script>
	(function () {
		var pathEl = document.getElementById("file_link") || document.getElementById("view_down_link");
		var path = pathEl.getAttribute("data-path");
		var fullUrl = encodeURI(window.location.protocol + "//" + window.location.host + path);
		var params = URLSearchParams && new URLSearchParams(document.location.search.substring(1));
		var url = params && params.get("url") && decodeURIComponent(params.get("url"));
		var currentSectionIndex = (params && params.get("loc")) ? params.get("loc") : undefined;
		var book = ePub(url || fullUrl);
		var rendition = book.renderTo("viewer", { width: "100%", height: 580, spread: "always" });
		rendition.display(currentSectionIndex);
		book.ready.then(function () {
			document.getElementById("next").addEventListener("click", function (e) {
				book.package.metadata.direction === "rtl" ? rendition.prev() : rendition.next();
				e.preventDefault();
			}, false);
			document.getElementById("prev").addEventListener("click", function (e) {
				book.package.metadata.direction === "rtl" ? rendition.next() : rendition.prev();
				e.preventDefault();
			}, false);
			var keyListener = function (e) {
				if ((e.keyCode || e.which) == 37) book.package.metadata.direction === "rtl" ? rendition.next() : rendition.prev();
				if ((e.keyCode || e.which) == 39) book.package.metadata.direction === "rtl" ? rendition.prev() : rendition.next();
			};
			rendition.on("keyup", keyListener);
			document.addEventListener("keyup", keyListener, false);
		});
		rendition.on("relocated", function (location) {
			var next = book.package.metadata.direction === "rtl" ? document.getElementById("prev") : document.getElementById("next");
			var prev = book.package.metadata.direction === "rtl" ? document.getElementById("next") : document.getElementById("prev");
			next.style.visibility = location.atEnd ? "hidden" : "visible";
			prev.style.visibility = location.atStart ? "hidden" : "visible";
		});
		book.loaded.navigation.then(function (toc) {
			var $select = document.getElementById("toc");
			var docfrag = document.createDocumentFragment();
			toc.forEach(function (chapter) {
				var option = document.createElement("option");
				option.textContent = chapter.label;
				option.setAttribute("ref", chapter.href);
				docfrag.appendChild(option);
			});
			$select.appendChild(docfrag);
			$select.onchange = function () {
				var index = $select.selectedIndex;
				var href = $select.options[index].getAttribute("ref");
				rendition.display(href);
				return false;
			};
		});
	})();
</script>
{{end}}
