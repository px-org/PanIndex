{{define "templates/pan/oxygen/view-office.html"}}
{{template "templates/pan/oxygen/view-base.html" .}}
{{end}}
{{define "oxygen-content-office"}}
<iframe id="view_office" class="rounded-lg" src="" style="width:100%;min-height:600px" frameborder="0">
	This is an embedded office file
</iframe>
{{end}}
{{define "oxygen-scripts-office"}}
<script>
	(function () {
		var path = document.getElementById("view_down_link").getAttribute("data-path");
		var fullUrl = encodeURI(window.location.protocol + "//" + window.location.host + path);
		document.getElementById("view_office").src = "https://view.officeapps.live.com/op/embed.aspx?src=" + fullUrl;
	})();
</script>
{{end}}
